name: keepalive

# Mantém o serviço Free do Render acordado em horário útil (08h-23h em Brasília = 11h-02h UTC).
# Fora da janela ele hiberna de propósito, para caber nas 750 h/mês do workspace.
on:
  schedule:
    - cron: '*/10 11-23,0-1 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 --output /dev/null https://notbroker.onrender.com/
